<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 176 94"
  fill="none"
>
  <defs>
    <style>
      .primary-light { fill: #3b6ea5; }
      .primary-main  { fill: #234f84; }
      .primary-dark  { fill: #162f52; }

      .secondary-light { fill: #c08be3; }
      .secondary-main  { fill: #9c5ed6; }
      .secondary-dark  { fill: #6f38a8; }
    </style>
  </defs>

  <!-- soft branded panel -->
  <rect x="8" y="10" width="160" height="74" rx="18" class="secondary-light" opacity="0.12"/>

  <!-- background accents -->
  <circle cx="138" cy="24" r="13" class="secondary-main" opacity="0.10"/>
  <circle cx="34" cy="70" r="11" class="primary-light" opacity="0.10"/>

  <!-- room shell -->
  <g transform="translate(28,16)">
    <!-- office walls/frame -->
    <rect x="0" y="6" width="92" height="48" rx="6" class="primary-main" opacity="0.10"/>
    <rect x="4" y="10" width="84" height="40" rx="4" fill="white" stroke="#234f84" stroke-width="2"/>

    <!-- left wall / door zone -->
    <rect x="10" y="16" width="16" height="28" rx="2.5" class="primary-main" opacity="0.16"/>
    <rect x="13" y="19" width="10" height="22" rx="1.6" fill="white" stroke="#234f84" stroke-width="1.4"/>
    <circle cx="21" cy="30" r="1.2" class="secondary-main"/>

    <!-- window -->
    <rect x="33" y="16" width="25" height="16" rx="2.3" class="secondary-light" opacity="0.35"/>
    <rect x="36" y="19" width="19" height="10" rx="1.6" fill="white"/>
    <path d="M45.5 19V29" stroke="#234f84" stroke-width="1.1"/>
    <path d="M36 24H55" stroke="#234f84" stroke-width="1.1"/>

    <!-- skyline hints -->
    <rect x="39" y="24" width="2.8" height="4.5" rx="0.5" class="primary-light"/>
    <rect x="43" y="22" width="2.8" height="6.5" rx="0.5" class="primary-main"/>
    <rect x="47" y="23" width="2.8" height="5.5" rx="0.5" class="primary-light"/>

    <!-- desk -->
    <rect x="51" y="36" width="24" height="5.5" rx="2.2" class="primary-main"/>
    <rect x="54" y="31.5" width="13" height="5" rx="1.5" class="primary-light"/>
    <rect x="56" y="41" width="2.6" height="8" rx="1.2" class="primary-dark"/>
    <rect x="67.5" y="41" width="2.6" height="8" rx="1.2" class="primary-dark"/>

    <!-- office chair -->
    <circle cx="78" cy="38" r="4.2" class="secondary-main"/>
    <rect x="74.6" y="43" width="6.8" height="5.8" rx="2.2" class="secondary-dark"/>
    <rect x="77" y="48.2" width="2" height="4.6" rx="1" class="primary-dark"/>
    <path d="M74.5 53.2H81.5" stroke="#162f52" stroke-width="1.4" stroke-linecap="round"/>

    <!-- floor line -->
    <path d="M12 49H80" stroke="#234f84" stroke-width="1.4" stroke-linecap="round" opacity="0.25"/>

    <!-- premium badge -->
    <circle cx="88" cy="12" r="7" class="secondary-main"/>
    <path d="M88 8.8L89 11L91.4 11.2L89.6 12.8L90.2 15.1L88 13.9L85.8 15.1L86.4 12.8L84.6 11.2L87 11Z" fill="white"/>
  </g>

  <!-- original building volume repurposed as office wing -->
  <g transform="translate(2,0)">
    <path class="secondary-main" opacity="0.75" d="m70.44,2.07L1.48,34.36c-.9.42-1.48,1.33-1.48,2.32v36.77c0,.54.56.9,1.05.67l68.97-32.28c.9-.42,1.48-1.33,1.48-2.32V2.74c0-.54-.56-.9-1.05-.67Zm-13.48,39.86L14.54,61.84v-26.2L56.96,15.73v26.2Z"/>
  </g>

  <!-- subtle access / lock accent -->
  <g transform="translate(122,48)">
    <rect x="0" y="6" width="12" height="10" rx="2.2" class="primary-main"/>
    <path d="M3.2 6V4.8C3.2 2.7 4.9 1 7 1C9.1 1 10.8 2.7 10.8 4.8V6" stroke="#234f84" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="6" cy="11" r="1.2" fill="white"/>
  </g>

  <!-- original bottom furniture / people cluster recolored and softened -->
  <g transform="translate(8,2)">
    <path class="primary-main" d="m52.98,85.59s0,.04,0,.06c0,.01,0,.02,0,.03v5.52s.01.05.01.07c0,.03-.01.05-.01.07,0,1.71,2.61,2.6,5.19,2.6s5.19-.89,5.19-2.6c0-.03-.01-.05-.01-.07,0-.03.01-.05.01-.07v-5.52s0-.02,0-.03c0-.02,0-.04,0-.06,0-3.41-10.39-3.41-10.39,0Zm5.19-1.1c2.42,0,3.69.82,3.69,1.1s-1.27,1.1-3.69,1.1-3.69-.82-3.69-1.1,1.27-1.1,3.69-1.1Zm3.69,6.85c0,.28-1.27,1.1-3.69,1.1s-3.69-.82-3.69-1.1c0-.03-.01-.05-.01-.07,0-.03.01-.05.01-.07v-3.73c.99.48,2.34.72,3.69.72s2.71-.25,3.69-.72v3.73s.01.05.01.07c0,.03-.01.05-.01.07Z" opacity="0.95"/>
  </g>

  <!-- brand dots -->
  <g transform="translate(144,18)">
    <circle cx="0" cy="0" r="2.2" class="secondary-main"/>
    <circle cx="7" cy="7" r="1.5" class="primary-light"/>
    <circle cx="-6" cy="8" r="1.4" class="secondary-dark"/>
  </g>
</svg>
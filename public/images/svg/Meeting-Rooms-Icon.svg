<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 176 94"
  fill="none"
>
  <defs>
    <style>
      .primary-light { fill: #3b6ea5; }
      .primary-main  { fill: #234f84; }
      .primary-dark  { fill: #162f52; }

      .secondary-light { fill: #c08be3; }
      .secondary-main  { fill: #9c5ed6; }
      .secondary-dark  { fill: #6f38a8; }
    </style>
  </defs>

  <!-- soft branded panel -->
  <rect x="8" y="10" width="160" height="74" rx="18" class="secondary-light" opacity="0.12"/>

  <!-- background accents -->
  <circle cx="140" cy="24" r="13" class="secondary-main" opacity="0.10"/>
  <circle cx="34" cy="71" r="10" class="primary-light" opacity="0.10"/>

  <!-- presentation screen -->
  <g transform="translate(102,18)">
    <rect x="0" y="0" width="30" height="20" rx="3" class="primary-main" opacity="0.14"/>
    <rect x="2.4" y="2.4" width="25.2" height="15.2" rx="2" fill="white" stroke="#234f84" stroke-width="1.8"/>
    <rect x="9.5" y="20" width="10.5" height="2.6" rx="1.3" class="primary-main"/>
    <rect x="13" y="22.2" width="3.5" height="4.6" rx="1" class="primary-dark"/>
    <path d="M7 8.5H17" stroke="#9c5ed6" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M7 12H22" stroke="#3b6ea5" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- conversation / collaboration accent -->
  <g transform="translate(121,49)">
    <circle cx="0" cy="0" r="5.8" class="secondary-main" opacity="0.9"/>
    <circle cx="10" cy="-3" r="4.6" class="primary-light" opacity="0.9"/>
    <path d="M-2.5 7.5L-1.2 4.5L1.8 6.2Z" class="secondary-main"/>
  </g>

  <!-- central meeting table -->
  <g transform="translate(56,40)">
    <rect x="0" y="8" width="42" height="14" rx="7" class="primary-main"/>
    <rect x="3.5" y="10.2" width="35" height="9.6" rx="4.8" class="primary-light" opacity="0.35"/>

    <!-- table legs -->
    <rect x="7" y="21.5" width="3.2" height="8" rx="1.4" class="primary-dark"/>
    <rect x="31.8" y="21.5" width="3.2" height="8" rx="1.4" class="primary-dark"/>

    <!-- top decorative line -->
    <rect x="12" y="13.8" width="18" height="2.2" rx="1.1" fill="white" opacity="0.9"/>
  </g>

  <!-- chairs / attendees -->
  <g transform="translate(40,35)">
    <!-- left top chair -->
    <circle cx="0" cy="0" r="4.4" class="secondary-main"/>
    <rect x="-4.3" y="6" width="8.6" height="7.8" rx="3.2" class="secondary-dark"/>

    <!-- left bottom chair -->
    <circle cx="2" cy="28" r="4.4" class="primary-light"/>
    <rect x="-2.3" y="34" width="8.6" height="7.8" rx="3.2" class="primary-main"/>

    <!-- right top chair -->
    <circle cx="76" cy="0" r="4.4" class="primary-light"/>
    <rect x="71.7" y="6" width="8.6" height="7.8" rx="3.2" class="primary-main"/>

    <!-- right bottom chair -->
    <circle cx="74" cy="28" r="4.4" class="secondary-main"/>
    <rect x="69.7" y="34" width="8.6" height="7.8" rx="3.2" class="secondary-dark"/>
  </g>

  <!-- subtle room frame -->
  <g transform="translate(24,20)">
    <path d="M0 50V8C0 3.6 3.6 0 8 0H64" stroke="#234f84" stroke-width="1.8" stroke-linecap="round" opacity="0.18"/>
    <path d="M104 0H120C124.4 0 128 3.6 128 8V50" stroke="#234f84" stroke-width="1.8" stroke-linecap="round" opacity="0.18"/>
  </g>

  <!-- original collaboration flourish, recolored and repurposed -->
  <g transform="translate(4,-2)">
    <path class="secondary-light" d="m43.98,41.03c-.78.95-1.68,2.15-2.47,3.4-.65-.78-1.28-1.52-1.8-2.14-2.4-2.98-6.15-4.63-3.57,2.62.77,2.18,2.83,5.08,3.82,5.77.42.29.83.5,1.55.53,0,0,0,0,.01,0,2.22.33,2.86-.2,3.37-.82,1.71-2.07,3.89-5.98,4.38-8.1,1.82-7.83-2.55-4.59-5.29-1.26Z"/>
  </g>

  <!-- small brand dots -->
  <g transform="translate(144,18)">
    <circle cx="0" cy="0" r="2.2" class="secondary-main"/>
    <circle cx="7" cy="7" r="1.5" class="primary-light"/>
    <circle cx="-6" cy="8" r="1.4" class="secondary-dark"/>
  </g>
</svg>
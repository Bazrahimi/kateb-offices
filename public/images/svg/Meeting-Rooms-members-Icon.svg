<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 176 94"
  fill="none"
>
  <defs>
    <style>
      .primary-light { fill: #3b6ea5; }
      .primary-main  { fill: #234f84; }
      .primary-dark  { fill: #162f52; }

      .secondary-light { fill: #dcb5ef; }
      .secondary-main  { fill: #a36adf; }
      .secondary-dark  { fill: #8751c7; }

      .gold-light { fill: #f2d48a; }
      .gold-main  { fill: #d4a93d; }
      .gold-dark  { fill: #a67b17; }
    </style>
  </defs>

  <!-- soft premium panel -->
  <rect x="8" y="10" width="160" height="74" rx="18" class="secondary-light" opacity="0.18"/>

  <!-- ambient accents -->
  <circle cx="143" cy="24" r="13" class="secondary-main" opacity="0.12"/>
  <circle cx="33" cy="72" r="10" class="primary-light" opacity="0.10"/>

  <!-- room frame -->
  <g transform="translate(24,20)">
    <path d="M0 50V8C0 3.6 3.6 0 8 0H64" stroke="#234f84" stroke-width="1.8" stroke-linecap="round" opacity="0.18"/>
    <path d="M104 0H120C124.4 0 128 3.6 128 8V50" stroke="#234f84" stroke-width="1.8" stroke-linecap="round" opacity="0.18"/>
  </g>

  <!-- member badge -->
  <g transform="translate(18,16)">
    <rect x="0" y="0" width="34" height="18" rx="9" class="gold-main" opacity="0.16"/>
    <circle cx="9" cy="9" r="5.2" class="gold-main"/>
    <path d="M7.2 9.2L8.5 10.5L11.1 7.8" stroke="white" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 9H28" stroke="#a67b17" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M18 12H24" stroke="#a67b17" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- presentation screen -->
  <g transform="translate(104,17)">
    <rect x="0" y="0" width="31" height="21" rx="4" class="primary-main" opacity="0.12"/>
    <rect x="2.5" y="2.5" width="26" height="16" rx="2.4" fill="white" stroke="#234f84" stroke-width="1.6"/>
    <path d="M8 8H20" stroke="#a36adf" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M8 12H23" stroke="#3b6ea5" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="21.5" cy="8" r="2.3" class="gold-main" opacity="0.95"/>
    <path d="M20.5 8L21.2 8.8L22.5 7.2" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="10.2" y="21" width="10.5" height="2.4" rx="1.2" class="primary-main"/>
    <rect x="13.8" y="23.2" width="3.2" height="4.4" rx="1" class="primary-dark"/>
  </g>

  <!-- central table -->
  <g transform="translate(56,39)">
    <rect x="0" y="8" width="44" height="14.5" rx="7.25" class="primary-main"/>
    <rect x="4" y="10.2" width="36" height="10" rx="5" class="secondary-main" opacity="0.22"/>
    <rect x="12.5" y="13.9" width="19" height="2.3" rx="1.1" fill="white" opacity="0.96"/>
    <rect x="7.2" y="22" width="3.1" height="8" rx="1.4" class="primary-dark"/>
    <rect x="33.7" y="22" width="3.1" height="8" rx="1.4" class="primary-dark"/>
  </g>

  <!-- attendees -->
  <g transform="translate(39,34)">
    <!-- left top -->
    <circle cx="0" cy="0" r="4.3" class="secondary-main"/>
    <rect x="-4.2" y="6" width="8.4" height="8" rx="3.2" class="secondary-dark"/>

    <!-- left bottom -->
    <circle cx="3" cy="29" r="4.3" class="gold-main"/>
    <rect x="-1.2" y="35" width="8.4" height="8" rx="3.2" class="gold-dark"/>

    <!-- right top -->
    <circle cx="78" cy="0" r="4.3" class="primary-light"/>
    <rect x="73.8" y="6" width="8.4" height="8" rx="3.2" class="primary-main"/>

    <!-- right bottom -->
    <circle cx="75" cy="29" r="4.3" class="secondary-main"/>
    <rect x="70.8" y="35" width="8.4" height="8" rx="3.2" class="secondary-dark"/>
  </g>

  <!-- reserved/member ribbon accent -->
  <g transform="translate(122,50)">
    <circle cx="0" cy="0" r="5.8" class="gold-main" opacity="0.95"/>
    <path d="M-1.8 0L-0.2 1.8L2.6-1.2" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-2 6.5L-1 4.2L0.8 5.2L2.4 4.2L3.2 6.5" class="gold-dark"/>
  </g>

  <!-- flourish -->
  <g transform="translate(4,-2)">
    <path class="secondary-light" d="m43.98,41.03c-.78.95-1.68,2.15-2.47,3.4-.65-.78-1.28-1.52-1.8-2.14-2.4-2.98-6.15-4.63-3.57,2.62.77,2.18,2.83,5.08,3.82,5.77.42.29.83.5,1.55.53,0,0,0,0,.01,0,2.22.33,2.86-.2,3.37-.82,1.71-2.07,3.89-5.98,4.38-8.1,1.82-7.83-2.55-4.59-5.29-1.26Z"/>
  </g>

  <!-- brand dots -->
  <g transform="translate(145,17)">
    <circle cx="0" cy="0" r="2.2" class="gold-main"/>
    <circle cx="7" cy="7" r="1.5" class="primary-light"/>
    <circle cx="-6" cy="8" r="1.4" class="secondary-dark"/>
  </g>
</svg>
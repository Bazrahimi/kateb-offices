<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 176 94"
  fill="none"
>
  <defs>
    <style>
      .primary-light { fill: #3b6ea5; }
      .primary-main  { fill: #234f84; }
      .primary-dark  { fill: #162f52; }

      .secondary-light { fill: #c08be3; }
      .secondary-main  { fill: #9c5ed6; }
      .secondary-dark  { fill: #6f38a8; }
    </style>
  </defs>

  <!-- soft branded background -->
  <rect x="8" y="10" width="160" height="74" rx="18" class="secondary-light" opacity="0.12"/>

  <!-- soft accents -->
  <circle cx="138" cy="24" r="13" class="secondary-main" opacity="0.10"/>
  <circle cx="34" cy="70" r="11" class="primary-light" opacity="0.10"/>

  <!-- subtle remote-signal / brand flourish -->
  <g transform="translate(80,16)">
    <path class="secondary-light" d="m89.61,40.4c-.38,1.13-.83,2.56-1.22,4.03-.32-.92-.63-1.8-.88-2.55-1.18-3.53-3.03-5.5-1.76,3.1.38,2.58.91,5.53,1.88,6.85.16.37.41.59.76.63,0,0,0,0,0,0,1.08.39,1.55-.05,1.65-.96,1.11-1.94,1.92-7.11,2.16-9.62.9-9.29-1.26-5.45-2.6-1.49Z"/>
  </g>

  <!-- main virtual office screen / address frame -->
  <g transform="translate(18,12)">
    <!-- monitor frame -->
    <rect x="28" y="8" width="78" height="44" rx="4" class="primary-main" opacity="0.12"/>
    <rect x="31" y="11" width="72" height="38" rx="3" fill="white" stroke="#234f84" stroke-width="2"/>

    <!-- address card -->
    <rect x="38" y="18" width="34" height="15" rx="3" class="secondary-light" opacity="0.45"/>
    <rect x="42" y="22" width="18" height="2.4" rx="1.2" class="primary-main"/>
    <rect x="42" y="27" width="24" height="2.4" rx="1.2" class="primary-light"/>

    <!-- simplified building / location presence -->
    <rect x="78" y="18" width="12" height="20" rx="2" class="primary-main" opacity="0.9"/>
    <rect x="82" y="22" width="2.5" height="2.5" rx="0.6" fill="white"/>
    <rect x="86" y="22" width="2.5" height="2.5" rx="0.6" fill="white"/>
    <rect x="82" y="27" width="2.5" height="2.5" rx="0.6" fill="white"/>
    <rect x="86" y="27" width="2.5" height="2.5" rx="0.6" fill="white"/>
    <rect x="82" y="32" width="2.5" height="6" rx="0.8" fill="white"/>

    <!-- envelope -->
    <rect x="42" y="37" width="14" height="9" rx="1.8" class="secondary-main" opacity="0.95"/>
    <path d="M42.8 38.5L49 42.5L55.2 38.5" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- phone -->
    <rect x="60" y="35.5" width="7.8" height="12" rx="2.1" class="primary-dark"/>
    <rect x="62.1" y="38" width="3.6" height="5.2" rx="0.6" fill="white"/>
    <circle cx="64" cy="45.5" r="0.7" fill="white"/>

    <!-- monitor stand -->
    <path d="M63 52H71L74 60H60L63 52Z" class="primary-main" opacity="0.85"/>
    <rect x="52" y="60" width="30" height="3.5" rx="1.75" class="primary-dark" opacity="0.9"/>

    <!-- small floating plus badge -->
    <circle cx="109" cy="21" r="7" class="secondary-main"/>
    <path d="M109 17.8V24.2M105.8 21H112.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>

    <!-- small signal dots -->
    <circle cx="98" cy="16" r="1.7" class="primary-light"/>
    <circle cx="102" cy="13" r="1.3" class="secondary-dark"/>
  </g>

  <!-- original line-art base elements recolored and lightly repositioned -->
  <g transform="translate(6,2)">
    <polygon class="secondary-light" opacity="0.45" points="61.08 35.26 61.06 17.95 27.91 9.24 27.91 49.03 38.56 51.83 47.15 48.08 47.15 38.29 56.28 34 61.08 35.26"/>
  </g>

  <g transform="translate(10,4)">
    <path class="primary-main" d="m88.88,58.87c1.76,0,3.11-.78,3.29-1.88l.61-3.57c.07-.41-.21-.8-.61-.87-.38-.06-.74.18-.84.54-1.53.73-3.34.73-4.89,0-.1-.37-.45-.62-.84-.55-.41.07-.68.46-.61.87l.62,3.63c.3,1.14,1.52,1.82,3.28,1.82Zm2.14-4.05l-.33,1.92c-.03.17-.63.63-1.81.63s-1.74-.36-1.81-.63l-.33-1.91c.7.21,1.42.33,2.14.33s1.44-.12,2.14-.33Z"/>
  </g>

  <!-- subtle guide dots -->
  <g transform="translate(140,18)">
    <circle cx="0" cy="0" r="2.2" class="secondary-main"/>
    <circle cx="7" cy="7" r="1.5" class="primary-light"/>
    <circle cx="-6" cy="8" r="1.4" class="secondary-dark"/>
  </g>
</svg>